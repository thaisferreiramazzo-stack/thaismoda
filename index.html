<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>THAISMODA.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio THAISMODA.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f0ea;
      color: #171717;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 50%;
      top: -270px;
      right: -150px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      background: rgba(183, 154, 126, .08);
      border-radius: 50%;
      bottom: -200px;
      left: -100px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-block;
      border-bottom: 1px solid #b79a7e;
      padding: 0 5px 8px;
      margin-bottom: 38px;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #88715c;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 9vw, 88px);
      font-weight: normal;
      letter-spacing: -3px;
      margin-bottom: 10px;
    }

    .moda {
      font-style: italic;
      color: #a17f62;
    }

    .line {
      width: 45px;
      height: 1px;
      background: #b79a7e;
      margin: 25px auto;
    }

    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: normal;
      margin-bottom: 24px;
    }

    p {
      max-width: 630px;
      margin: 0 auto 38px;
      color: #6f6963;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 34px;
      background: #171717;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #a17f62;
    }

    .footer {
      margin-top: 55px;
      color: #a29b94;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="tag">Domínio disponível</div>

    <h1>THAIS<span class="moda">MODA</span></h1>

    <div class="line"></div>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um nome elegante e memorável para projetos de moda,
      estilo, conteúdo, e-commerce ou uma nova marca digital.
      THAISMODA.COM.BR está disponível para aquisição.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20THAISMODA.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      THAISMODA.COM.BR
    </div>

  </main>

</body>
</html>
